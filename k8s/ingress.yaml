apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: toggle-master-ingress
  namespace: auth-service
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/service-upstream: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port:
                  number: 8001

          - path: /flags(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: flag-service-ext
                port:
                  number: 8002

          - path: /targeting(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: targeting-service-ext
                port:
                  number: 8003

          - path: /evaluate(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: evaluation-service-ext
                port:
                  number: 8004

          - path: /analytics(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: analytics-service-ext
                port:
                  number: 8005
---
# ExternalName services para rotear para outros namespaces
---
apiVersion: v1
kind: Service
metadata:
  name: flag-service-ext
  namespace: auth-service
spec:
  ports:
    - port: 8002
---
apiVersion: v1
kind: Endpoints
metadata:
  name: flag-service-ext
  namespace: auth-service
subsets:
  - addresses:
      - ip: 10.100.65.189
    ports:
      - port: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: targeting-service-ext
  namespace: auth-service
spec:
  ports:
    - port: 8003
---
apiVersion: v1
kind: Endpoints
metadata:
  name: targeting-service-ext
  namespace: auth-service
subsets:
  - addresses:
      - ip: 10.100.65.223
    ports:
      - port: 8003
---
apiVersion: v1
kind: Service
metadata:
  name: evaluation-service-ext
  namespace: auth-service
spec:
  ports:
    - port: 8004
---
apiVersion: v1
kind: Endpoints
metadata:
  name: evaluation-service-ext
  namespace: auth-service
subsets:
  - addresses:
      - ip: 10.100.4.49
    ports:
      - port: 8004
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service-ext
  namespace: auth-service
spec:
  ports:
    - port: 8005
---
apiVersion: v1
kind: Endpoints
metadata:
  name: analytics-service-ext
  namespace: auth-service
subsets:
  - addresses:
      - ip: 10.100.5.179
    ports:
      - port: 8005