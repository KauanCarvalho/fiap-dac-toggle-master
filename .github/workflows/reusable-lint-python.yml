name: Reusable Python Lint

on:
  workflow_call:
    inputs:
      service_path:
        required: true
        type: string
      python_version:
        required: false
        type: string
        default: '3.11'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f ${{ inputs.service_path }}/requirements.txt ]; then pip install -r ${{ inputs.service_path }}/requirements.txt; fi

      - name: Run flake8
        run: |
          flake8 ${{ inputs.service_path }} --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 ${{ inputs.service_path }} --count --max-complexity=10 --max-line-length=127 --statistics
