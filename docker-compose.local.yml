# Stack completa para validação local de observabilidade.
# Uso: docker compose -f docker-compose.local.yml --env-file .env.dev up --build
#
# UIs disponíveis após subir:
#   Grafana    → http://localhost:3000  (admin / admin)
#   Prometheus → http://localhost:9090
#   Tempo      → http://localhost:3200  (API only)
#
# Fluxo de dados:
#   Serviços ──OTLP/gRPC──▶ otelcol ──▶ tempo   (traces)
#                                    └──▶ prometheus (métricas via endpoint)
#   Tempo ──remote_write──▶ prometheus  (service-graph + span metrics)
#   Docker logs ──▶ promtail ──▶ loki
#   Grafana ◀── prometheus / loki / tempo

services:

  # ── Observabilidade ───────────────────────────────────────────────────────

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.105.0
    container_name: otelcol
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./local/observability/otelcol-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (serviços enviam aqui)
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus scrape endpoint (métricas dos serviços)
      - "8888:8888"   # Métricas internas do collector
    networks:
      - local-network
    depends_on:
      tempo:
        condition: service_healthy

  tempo:
    image: grafana/tempo:2.4.2
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./local/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # HTTP API
      - "9095:9095"   # gRPC (Grafana 11.x usa gRPC para queries TraceQL)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - local-network
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"   # Recebe remote_write do Tempo
    volumes:
      - ./local/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - local-network

  loki:
    image: grafana/loki:3.1.0
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./local/observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - local-network

  promtail:
    image: grafana/promtail:3.1.0
    container_name: promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ./local/observability/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - local-network
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor metricsSummary"
    volumes:
      - ./local/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - local-network
    depends_on:
      - prometheus
      - loki
      - tempo

  # ── Infraestrutura ────────────────────────────────────────────────────────

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER_AUTH_SERVICE}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_AUTH_SERVICE}
      POSTGRES_DB: ${POSTGRES_DB_AUTH_SERVICE}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
      - ./local/services/auth-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_AUTH_SERVICE} -d ${POSTGRES_DB_AUTH_SERVICE}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - local-network

  toggle-db:
    image: postgres:16-alpine
    container_name: toggle-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER_TOGGLE_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_TOGGLE_DB}
      POSTGRES_DB: ${POSTGRES_DB_TOGGLE_DB}
    volumes:
      - toggle-db-data:/var/lib/postgresql/data
      - ./local/services/flag-service/db/init.sql:/docker-entrypoint-initdb.d/1_flag_init.sql
      - ./local/services/targeting-service/db/init.sql:/docker-entrypoint-initdb.d/2_targeting_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_TOGGLE_DB} -d ${POSTGRES_DB_TOGGLE_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - local-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - local-network

  localstack:
    image: localstack/localstack:3.8.1
    container_name: localstack
    restart: unless-stopped
    environment:
      - SERVICES=sqs,dynamodb
      - DEFAULT_REGION=us-east-1
      - SQS_ENDPOINT_STRATEGY=path
    volumes:
      - ./local/observability/localstack-init.sh:/etc/localstack/init/ready.d/init.sh
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"running\"\\|\"available\"' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - local-network

  # ── Microsserviços ────────────────────────────────────────────────────────

  auth-service:
    build:
      context: ./local/services/auth-service
    pull_policy: never
    container_name: auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER_AUTH_SERVICE}:${POSTGRES_PASSWORD_AUTH_SERVICE}@auth-db:5432/${POSTGRES_DB_AUTH_SERVICE}?sslmode=disable"
      PORT: ${PORT_AUTH_SERVICE}
      MASTER_KEY: ${MASTER_KEY_AUTH_SERVICE}
      OTEL_EXPORTER_OTLP_ENDPOINT: "otelcol:4317"
    ports:
      - "${PORT_AUTH_SERVICE}:${PORT_AUTH_SERVICE}"
    depends_on:
      auth-db:
        condition: service_healthy
      otelcol:
        condition: service_started
    networks:
      - local-network

  flag-service:
    build:
      context: ./local/services/flag-service
    pull_policy: never
    container_name: flag-service
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER_TOGGLE_DB}:${POSTGRES_PASSWORD_TOGGLE_DB}@toggle-db:5432/${POSTGRES_DB_TOGGLE_DB}?sslmode=disable"
      PORT: ${PORT_FLAG_SERVICE}
      AUTH_SERVICE_URL: "http://auth-service:${PORT_AUTH_SERVICE}"
      OTEL_SERVICE_NAME: "flag-service"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otelcol:4317"
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    ports:
      - "${PORT_FLAG_SERVICE}:${PORT_FLAG_SERVICE}"
    depends_on:
      toggle-db:
        condition: service_healthy
      auth-service:
        condition: service_started
      otelcol:
        condition: service_started
    networks:
      - local-network

  targeting-service:
    build:
      context: ./local/services/targeting-service
    pull_policy: never
    container_name: targeting-service
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER_TOGGLE_DB}:${POSTGRES_PASSWORD_TOGGLE_DB}@toggle-db:5432/${POSTGRES_DB_TOGGLE_DB}?sslmode=disable"
      PORT: ${PORT_TARGETING_SERVICE}
      AUTH_SERVICE_URL: "http://auth-service:${PORT_AUTH_SERVICE}"
      OTEL_SERVICE_NAME: "targeting-service"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otelcol:4317"
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    ports:
      - "${PORT_TARGETING_SERVICE}:${PORT_TARGETING_SERVICE}"
    depends_on:
      toggle-db:
        condition: service_healthy
      auth-service:
        condition: service_started
      otelcol:
        condition: service_started
    networks:
      - local-network

  analytics-service:
    build:
      context: ./local/services/analytics-service
    pull_policy: never
    container_name: analytics-service
    restart: unless-stopped
    environment:
      PORT: ${PORT_ANALYTICS_SERVICE}
      AWS_REGION: ${AWS_REGION}
      AWS_SQS_URL: ${AWS_SQS_URL}
      AWS_DYNAMODB_TABLE: ${AWS_DYNAMODB_TABLE}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      OTEL_SERVICE_NAME: "analytics-service"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otelcol:4317"
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    ports:
      - "${PORT_ANALYTICS_SERVICE}:${PORT_ANALYTICS_SERVICE}"
    depends_on:
      localstack:
        condition: service_healthy
      otelcol:
        condition: service_started
    networks:
      - local-network

  evaluation-service:
    build:
      context: ./local/services/evaluation-service
    pull_policy: never
    container_name: evaluation-service
    restart: unless-stopped
    environment:
      PORT: ${PORT_EVALUATION_SERVICE}
      REDIS_URL: "redis://redis:6379"
      FLAG_SERVICE_URL: "http://flag-service:${PORT_FLAG_SERVICE}"
      TARGETING_SERVICE_URL: "http://targeting-service:${PORT_TARGETING_SERVICE}"
      SERVICE_API_KEY: ${EVALUATION_SERVICE_API_KEY}
      AWS_SQS_URL: ${AWS_SQS_URL}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: "otelcol:4317"
    ports:
      - "${PORT_EVALUATION_SERVICE}:${PORT_EVALUATION_SERVICE}"
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      flag-service:
        condition: service_started
      targeting-service:
        condition: service_started
      localstack:
        condition: service_healthy
      otelcol:
        condition: service_started
    networks:
      - local-network

volumes:
  auth-db-data:
  toggle-db-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:

networks:
  local-network:
    driver: bridge
